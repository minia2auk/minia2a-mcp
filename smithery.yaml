# Smithery.ai auto-discovery configuration for minia2a-mcp
# Smithery crawls GitHub repos with this file and auto-indexes MCP servers

name: minia2a-mcp
description: |
  Agent-to-agent API marketplace with built-in x402 micropayments.
  Discover and call 1,600+ pay-per-call services (AI inference, crypto data,
  web scraping, CAPTCHA solving) with automatic USDC settlement on 8 chains.
  Claude Code auto-mode ready with HTTP 402 machine-readable payment headers.
  15 free trial calls shared globally, no wallet required to start.

repository: https://github.com/minia2a-org/minia2a-mcp
homepage: https://minia2a.uk
icon: https://minia2a.uk/favicon.ico

categories:
  - ai-agents
  - payments
  - crypto
  - api-marketplace
  - developer-tools

tags:
  - x402
  - usdc
  - micropayments
  - agent-economy
  - m2m
  - auto-mode
  - claude-code
  - pay-per-call
  - trial-first

runtime: node
transport: stdio
entrypoint: dist/index.js

# Tools exposed by this MCP server
tools:
  - name: minia2a_list_services
    description: |
      List available x402 pay-per-call services. Returns service name, description,
      price in USD cents, category, and trial availability. Filter by category
      (ai, crypto, utility, tools) or search by keyword.
    readOnly: true

  - name: minia2a_get_service
    description: |
      Get detailed info about a specific x402 service. Returns full endpoint URL,
      pricing, supported chains, trial count, and usage instructions.
    readOnly: true

  - name: minia2a_get_stats
    description: |
      Get minia2a marketplace stats: total services, registered agents, trial usage,
      transaction volume, and platform health.
    readOnly: true

  - name: minia2a_credits
    description: |
      Explain the V5 credit/trial model and report platform stats. V5 has no
      per-wallet balance endpoint — credits decrement automatically per call.
    readOnly: true

  - name: minia2a_check_endpoint
    description: |
      Verify an x402 endpoint is healthy and responding. Returns status code,
      payment headers, trial info, and response time. Useful before spending credits.
    readOnly: true

  - name: minia2a_register
    description: |
      Register with a self-custody wallet + EIP-191 signature for 500 free
      credits (through Sep 1, 2026). If no wallet is supplied, one is generated
      and the private key returned.
    readOnly: false
    destructive: true

  - name: minia2a_buy_credits
    description: |
      Claim credits from a completed USDC on-chain transfer by submitting the
      transaction hash.
    readOnly: false
    destructive: true

  - name: minia2a_call_service
    description: |
      Call any x402 service by name or ID with ?wallet=<your-wallet> (credits
      decrement) or anonymously (trial). Handles the HTTP 402 payment flow.
    readOnly: false
    destructive: true

# Minimum Claude Code version for auto-mode
minClaudeCodeVersion: "1.0.0"

# Auto-mode compatibility
autoModeCompatible: true
autoModeFeatures:
  - machine-readable-402-headers
  - trial-first-access
  - agent-budget-support
  - no-human-registration-required
